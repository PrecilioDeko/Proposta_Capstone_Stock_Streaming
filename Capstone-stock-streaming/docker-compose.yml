# =========================================================================
# CAPSTONE PROJECT — STOCK MARKET STREAMING ANALYTICS
# Bank Mandiri | Telkomsel (TLKM) | Bank ANZ | Bank BRI
# Jalankan semua dengan satu perintah:  docker compose up -d --build
# =========================================================================

networks:
  stock-net:
    driver: bridge

volumes:
  kafka_data:
  postgres_data:
  mongo_data:
  hadoop_namenode:
  hadoop_datanode:

services:

  # ------------------------------------------------------------------
  # 1) DATA INGESTION — Apache Kafka (KRaft mode, tanpa Zookeeper)
  #    NOTE: menggunakan image resmi apache/kafka (bukan bitnami/kafka).
  #    Sejak Agustus 2025, Bitnami memindahkan image bertag versi
  #    spesifik (spt. bitnami/kafka:3.7) ke paket berbayar, sehingga
  #    tidak lagi tersedia gratis di Docker Hub.
  # ------------------------------------------------------------------
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=0
      - KAFKA_PROCESS_ROLES=controller,broker
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
      - CLUSTER_ID=U2ZhY2VzdGF0ZXN0b2NrY2FwMQ
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - stock-net
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  # UI untuk memonitor topic & pesan Kafka lewat browser -> http://localhost:8081
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    restart: unless-stopped
    depends_on:
      - kafka
    ports:
      - "8081:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
    networks:
      - stock-net

  # ------------------------------------------------------------------
  # 4) DATA STORAGE — HDFS (single node namenode + datanode)
  # ------------------------------------------------------------------
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: namenode
    restart: unless-stopped
    environment:
      - CLUSTER_NAME=stock-cluster
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
    ports:
      - "9870:9870"   # HDFS Web UI -> http://localhost:9870
      - "9000:9000"
    volumes:
      - hadoop_namenode:/hadoop/dfs/name
    networks:
      - stock-net

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode
    restart: unless-stopped
    depends_on:
      - namenode
    environment:
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
      - SERVICE_PRECONDITION=namenode:9870
    volumes:
      - hadoop_datanode:/hadoop/dfs/data
    networks:
      - stock-net

  # ------------------------------------------------------------------
  # 4) DATA STORAGE — PostgreSQL (data terstruktur / hasil olahan)
  # ------------------------------------------------------------------
  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=stockdb
      - POSTGRES_USER=stockuser
      - POSTGRES_PASSWORD=stockpass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - stock-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockuser -d stockdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ------------------------------------------------------------------
  # 4) DATA STORAGE — MongoDB (data mentah / fleksibel, tidak terstruktur)
  # ------------------------------------------------------------------
  mongodb:
    image: mongo:7
    container_name: mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - stock-net
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 5s
      timeout: 5s
      retries: 10

  # UI untuk melihat isi MongoDB lewat browser -> http://localhost:8082
  mongo-express:
    image: mongo-express:1.0
    container_name: mongo-express
    restart: unless-stopped
    depends_on:
      - mongodb
    ports:
      - "8082:8081"
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongodb
      - ME_CONFIG_BASICAUTH=false
    networks:
      - stock-net

  # ------------------------------------------------------------------
  # 1) DATA SOURCES + PRODUCER — membaca dataset CSV & mengirim ke Kafka
  #    seolah-olah data mengalir real-time (streaming simulation)
  # ------------------------------------------------------------------
  producer:
    build: ./producer
    container_name: producer
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./data:/app/data:ro
    environment:
      - KAFKA_BROKER=kafka:9092
      - KAFKA_TOPIC=stock-raw
      - STREAM_DELAY_SECONDS=0.5
      - LOOP_FOREVER=true
    networks:
      - stock-net
    restart: unless-stopped

  # ------------------------------------------------------------------
  # 3) STREAM PROCESSING — Apache Spark Structured Streaming
  # ------------------------------------------------------------------
  spark-app:
    build: ./spark
    container_name: spark-app
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      namenode:
        condition: service_started
    ports:
      - "4040:4040"   # Spark Streaming UI -> http://localhost:4040
    environment:
      - KAFKA_BROKER=kafka:9092
      - KAFKA_TOPIC=stock-raw
      - POSTGRES_URL=jdbc:postgresql://postgres:5432/stockdb
      - POSTGRES_USER=stockuser
      - POSTGRES_PASSWORD=stockpass
      - MONGO_URI=mongodb://mongodb:27017
      - HDFS_URI=hdfs://namenode:9000
    networks:
      - stock-net
    restart: unless-stopped

  # ------------------------------------------------------------------
  # 6) VISUALIZATION — Streamlit Dashboard
  # ------------------------------------------------------------------
  dashboard:
    build: ./dashboard
    container_name: dashboard
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    ports:
      - "8501:8501"   # Dashboard -> http://localhost:8501
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=stockdb
      - POSTGRES_USER=stockuser
      - POSTGRES_PASSWORD=stockpass
      - MONGO_URI=mongodb://mongodb:27017
    networks:
      - stock-net
    restart: unless-stopped
